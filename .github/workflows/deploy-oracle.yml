name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'webApp/**'
      - 'deploy/oracle/**'
      - '.github/workflows/deploy-oracle.yml'
  workflow_dispatch:

concurrency:
  group: deploy-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Oracle Always Free
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST || '92.4.138.110' }}
      ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
      API_DOMAIN: ${{ secrets.API_DOMAIN || 'api.biashara360.co.ke' }}
      WEB_DOMAIN: ${{ secrets.WEB_DOMAIN || 'biashara360.co.ke' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build backend FatJar
        run: ./gradlew :backend:buildFatJar -x test --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'webApp/package-lock.json'

      - name: Validate webApp build
        run: |
          cd webApp
          npm ci
          npm run build

      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret ORACLE_SSH_KEY is not configured in GitHub repository secrets!"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Update repository on Oracle VM
        run: |
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" "bash -s" << 'EOF'
            set -Eeuo pipefail
            cd /opt/biashara360
            git fetch origin main
            git reset --hard origin/main
          EOF

      - name: Upload prebuilt FatJar to Oracle VM
        run: |
          scp -i ~/.ssh/oracle_key -o StrictHostKeyChecking=accept-new \
            backend/build/libs/backend-all.jar \
            "$ORACLE_USER@$ORACLE_HOST:/opt/biashara360/backend/app.jar"

      - name: Run container build and deploy on Oracle VM
        run: |
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" "bash -s" << 'EOF'
            set -Eeuo pipefail
            cd /opt/biashara360/deploy/oracle
            sudo ./deploy.sh
          EOF

      - name: Verify Health Checks
        run: |
          echo "Verifying API health (https://$API_DOMAIN/v1/health)..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_DOMAIN/v1/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy! (HTTP $STATUS)"
              break
            fi
            echo "Waiting for API... (HTTP $STATUS, attempt $i/12)"
            sleep 5
          done

          echo "Verifying Web Frontend (https://$WEB_DOMAIN/)..."
          WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$WEB_DOMAIN/" || true)
          if [ "$WEB_STATUS" = "200" ]; then
            echo "Web frontend is up! (HTTP $WEB_STATUS)"
          else
            echo "::warning::Web returned HTTP $WEB_STATUS"
          fi
