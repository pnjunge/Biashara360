name: Application CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate database migrations
        run: ./gradlew :shared:verifyCommonMainBiashara360DatabaseMigration --no-daemon

      - name: Run shared and backend tests
        run: ./gradlew :shared:desktopTest :backend:test --no-daemon

      - name: Compile Android and desktop
        run: ./gradlew :androidApp:compileDebugKotlinAndroid :desktopApp:compileKotlinDesktop --no-daemon

      - name: Run Android lint
        run: ./gradlew :androidApp:lintDebug --no-daemon
