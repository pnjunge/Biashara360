# docker-compose.yml for local development
# For Railway deployment, use railway.json instead

services:
  postgres:
    image: postgres:16-alpine
    container_name: biashara360-db-${COMPOSE_PROJECT_NAME:-malipo}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: biashara360-api-${COMPOSE_PROJECT_NAME:-malipo}
    ports:
      - "${API_PORT:-8081}:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/biashara360}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AFRICASTALKING_USERNAME: dummyUser
      AFRICASTALKING_APIKEY: dummyKey
      AFRICASTALKING_ENVIRONMENT: sandbox
      AFRICASTALKING_SENDERID: ""
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-your_consumer_key}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-your_consumer_secret}
      MPESA_SHORT_CODE: ${MPESA_SHORT_CODE:-174379}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      CS_MERCHANT_ID: ${CS_MERCHANT_ID:-your_merchant_id}
      CS_MERCHANT_KEY_ID: ${CS_MERCHANT_KEY_ID:-your_key_id}
      CS_MERCHANT_SECRET_KEY: ${CS_MERCHANT_SECRET_KEY:-your_shared_secret}
      CS_ENVIRONMENT: ${CS_ENVIRONMENT:-sandbox}
      KRA_ETIMS_ENV: ${KRA_ETIMS_ENV:-sandbox}
      META_APP_ID: ${META_APP_ID:-your_meta_app_id}
      META_APP_SECRET: ${META_APP_SECRET:-your_meta_app_secret}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-your_tiktok_client_key}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-your_tiktok_client_secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-your_anthropic_api_key}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-https://your-domain.com/v1/social/webhook}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  unified-inbox:
    build:
      context: ./unified-inbox
      dockerfile: Dockerfile
    container_name: biashara360-unified-inbox-${COMPOSE_PROJECT_NAME:-malipo}
    ports:
      - "${INBOX_PORT:-3000}:3000"
    environment:
      PORT: 3000
      INBOX_DATA_FILE: /app/data/inbox.json
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN:-dev_verify_token}
      META_APP_SECRET: ${META_APP_SECRET:-your_meta_app_secret}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-your_fb_access_token}
      INSTAGRAM_PAGE_ACCESS_TOKEN: ${INSTAGRAM_PAGE_ACCESS_TOKEN:-your_ig_access_token}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-your_wa_access_token}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-your_wa_phone_number_id}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-your_tiktok_client_key}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-your_tiktok_client_secret}
    volumes:
      - unified_inbox_data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
  unified_inbox_data:
