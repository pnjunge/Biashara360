
services:
  postgres:
    image: postgres:16-alpine
    container_name: biashara360-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..admin@biashara360.co.ke
      dockerfile: Dockerfile
    container_name: biashara360-api
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB}}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME}
      AFRICASTALKING_APIKEY: ${AFRICASTALKING_APIKEY}
      AFRICASTALKING_ENVIRONMENT: ${AFRICASTALKING_ENVIRONMENT}
      AFRICASTALKING_SENDERID: ${AFRICASTALKING_SENDERID}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORT_CODE: ${MPESA_SHORT_CODE}
      MPESA_ENV: ${MPESA_ENV}
      CS_MERCHANT_ID: ${CS_MERCHANT_ID}
      CS_MERCHANT_KEY_ID: ${CS_MERCHANT_KEY_ID}
      CS_MERCHANT_SECRET_KEY: ${CS_MERCHANT_SECRET_KEY}
      CS_ENVIRONMENT: ${CS_ENVIRONMENT}
      KRA_ETIMS_ENV: ${KRA_ETIMS_ENV}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
