ktor {
  deployment {
    port = 8080
    watch = [ classes ]
  }
  application {
    modules = [ com.app.biashara.ApplicationKt.module ]
  }
}

database {
  url = ${DATABASE_URL}
  driver = ${?DB_DRIVER}
  user = ${DB_USER}
  password = ${DB_PASSWORD}
}

redis {
  url = ${?REDIS_URL}
}

africastalking {
  username = ${?AFRICASTALKING_USERNAME}
  apiKey = ${?AFRICASTALKING_APIKEY}
  environment = ${?AFRICASTALKING_ENVIRONMENT}
  senderId = ${?AFRICASTALKING_SENDERID}
}

mpesa {
  consumerKey = ${?MPESA_CONSUMER_KEY}
  consumerSecret = ${?MPESA_CONSUMER_SECRET}
  shortCode = ${?MPESA_SHORT_CODE}
  passkeysByBusiness = ${?MPESA_PASSKEYS_JSON}
  initiatorName = ${?MPESA_INITIATOR_NAME}
  initiatorPassword = ${?MPESA_INITIATOR_PASSWORD}
  certificateBase64 = ${?MPESA_CERTIFICATE_BASE64}
  resultUrl = ${?MPESA_RESULT_URL}
  timeoutUrl = ${?MPESA_TIMEOUT_URL}
  env = ${?MPESA_ENV}
  callbackUrl = ${?MPESA_CALLBACK_URL}
  accountType = ${?MPESA_ACCOUNT_TYPE}
}

cybersource {
  merchantId = ${?CS_MERCHANT_ID}
  keyId = ${?CS_MERCHANT_KEY_ID}
  sharedSecret = ${?CS_MERCHANT_SECRET_KEY}
  environment = ${?CS_ENVIRONMENT}
}

kra {
  etimsEnv = ${?KRA_ETIMS_ENV}
}

facebook {
  appId = ${?META_APP_ID}
  appSecret = ${?META_APP_SECRET}
  embeddedSignupConfigurationId = ${?META_EMBEDDED_SIGNUP_CONFIG_ID}
  webhookVerifyToken = ${?META_WEBHOOK_VERIFY_TOKEN}
  graphApiVersion = ${?META_GRAPH_API_VERSION}
}

social {
  metaSystemUserToken = ${?META_SYSTEM_USER_TOKEN}
  tokenEncryptionKey = ${?SOCIAL_TOKEN_ENCRYPTION_KEY}
}

tiktok {
  clientKey = ${?TIKTOK_CLIENT_KEY}
  clientSecret = ${?TIKTOK_CLIENT_SECRET}
}

anthropic {
  apiKey = ${?ANTHROPIC_API_KEY}
}

webhook {
  baseUrl = ${?WEBHOOK_BASE_URL}
}

whatsapp {
  otpToken = ${?WHATSAPP_OTP_TOKEN}
  otpPhoneNumberId = ${?WHATSAPP_OTP_PHONE_NUMBER_ID}
  otpTemplateName = ${?WHATSAPP_OTP_TEMPLATE_NAME}
  otpTemplateLanguage = ${?WHATSAPP_OTP_TEMPLATE_LANGUAGE}
}
